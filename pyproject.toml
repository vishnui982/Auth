[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guard"
version = "0.2.0"
description = "Stateful proof-carrying authorization with OPA and a checked Lean kernel"
requires-python = ">=3.11"
dependencies = ["cryptography>=46.0.7,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agent-guard = "agent_guard.cli:main"
agent-guard-v2 = "agent_guard.v2.cli:main"

[tool.setuptools.packages.find]
include = ["agent_guard*"]

[tool.setuptools.package-data]
"agent_guard.v2" = ["*.rego"]
"agent_guard.integration" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
